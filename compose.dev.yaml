services:
  api:
    build:
      context: ./backends/api
      target: base
    command: npm run dev
    volumes:
      - ./backends/api/src:/app/src
      - ./backends/data-sync/prisma:/app/prisma
    ports:
      - ${API_PORT}:${API_PORT}
    labels:
      - "traefik.http.routers.api.entrypoints=web"

  data-sync:
    build:
      context: ./backends/data-sync
      target: base
    command: npm run dev
    volumes:
      - ./backends/data-sync/src:/app/src
      - ./backends/data-sync/prisma:/app/prisma
    ports:
      - ${DATA_SYNC_PORT}:${DATA_SYNC_PORT}
    labels:
      - "traefik.http.routers.api.entrypoints=web"

  db:
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}

  web:
    build:
      context: ./web
      target: base
    command: npm run dev
    volumes:
      - "./web/src:/app/src"
    ports:
      - "5173:5173"
    labels:
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=5173"

  traefik:
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:5173"
    ports:
      - "8080:8080"

  redis:
    volumes:
      - ./redis/redis.dev.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
